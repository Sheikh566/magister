{{define "notice"}}
  {{if .Notice}}
  <div class="notice" style="display: flex; justify-content: space-between; align-items: center;">
    <div>{{.Notice}}</div>
    {{if .LastOutput}}
    <a href="#latest-output" style="white-space: nowrap; font-weight: 600; text-decoration: underline;">See logs</a>
    {{end}}
  </div>
  {{end}}
{{end}}
